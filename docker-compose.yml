# docker-compose.yml
services:
  migrate:
    image: ${ECR_URL:-registry/collabtask}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    env_file: .env
  app:
    image: ${ECR_URL:-registry/collabtask}
    env_file: .env

  worker:
    image: ${ECR_URL:-registry/collabtask}
    command: ["/app/.venv/bin/python","-m", "arq", "src.workers.arq_app.WorkerSettings"]
    env_file: .env
    depends_on:
      redis:
        condition: service_started

  nginx:
    image: nginx:latest
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_started