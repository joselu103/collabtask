# .github/workflows/github-actions.yml
name: CI Workflow
run-name: ${{ github.actor }} is pushing changes.
on:
  workflow_dispatch:
  push:
    branches: ["master", "workflows"]
  pull_request:
    branches: ["master", "workflows"]
jobs:
  build:
    name: Run ruff and tests
    runs-on: ubuntu-latest

    steps:
      - name: Copy project files
        uses: actions/checkout@v6
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set-up environment
        run: |
          uv sync
      - name: Run Ruff linter
        run: |
          uv run ruff check .
      - name: Run Ruff formatter
        run: |
          uv run ruff format --check .
      - name: Run tests
        run: |
          uv run pytest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: collabtask_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
  push:
    name: Deploy image in AWS
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Copy project files
        uses: actions/checkout@v6
      - name: Fetch AWS role and region
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Logs Docker into ECR, output registry URL
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build+Push the image to ECR
        run: |
          docker build -t $REGISTRY/projects/collabtask:$IMAGE_TAG -t $REGISTRY/projects/collabtask:latest .
          docker push $REGISTRY/projects/collabtask:$IMAGE_TAG
          docker push $REGISTRY/projects/collabtask:latest
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
